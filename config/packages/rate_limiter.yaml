# Anti-spam limits, consumed through App\Security\SubmissionThrottle (one limiter per App\Security\ThrottledAction case).
# Login attempts are limited separately by "login_throttling" (config/packages/security.yaml).
framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        password_reset_request:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        verification_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        private_message:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        forum_thread:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        forum_reply:
            policy: sliding_window
            limit: 6
            interval: '1 minute'
        photo_comment:
            policy: sliding_window
            limit: 6
            interval: '1 minute'
        report:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            registration: { policy: no_limit }
            password_reset_request: { policy: no_limit }
            verification_email: { policy: no_limit }
            private_message: { policy: no_limit }
            forum_thread: { policy: no_limit }
            forum_reply: { policy: no_limit }
            photo_comment: { policy: no_limit }
            report: { policy: no_limit }
